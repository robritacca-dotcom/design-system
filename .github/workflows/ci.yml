name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo. Nothing here publishes or
# writes, so the default token scope is narrowed to read-only.
permissions:
  contents: read

jobs:
  library:
    name: Lint + build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run build
      - run: npm run build:lib
      # validate-registry (run by prebuild) regenerates README/skills/barrel
      # content; a dirty tree here means committed generated content is stale.
      - name: Check generated content is committed
        run: git diff --exit-code

  test:
    name: Story tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # npm workspaces: the root install covers the website (and links
      # @robr0/design-system into its node_modules).
      - run: npm ci
      - run: npm run lint
        working-directory: website
      - run: npm run build
        working-directory: website
      # Reads the prerendered HTML, so it has to follow the build rather than
      # ride the prebuild validator chain.
      - run: node scripts/validate-rendered-spacing.mjs
      # Same reason: compares the corpus against what the pages actually render.
      - run: node scripts/validate-corpus-coverage.mjs
