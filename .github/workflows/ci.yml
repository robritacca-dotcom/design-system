name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job only reads the repo. Nothing here publishes or
# writes, so the default token scope is narrowed to read-only.
permissions:
  contents: read

jobs:
  # One job. This used to be four: the library build, the package-publish
  # lint, the story tests and the Storybook build all belonged to the design
  # system, which is published from its own repository now.
  site:
    name: Build and check the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Judges the dependency tree against the registry's advisory feed rather
      # than the code, so a failure here is news from outside rather than
      # something a local run could have caught earlier.
      - run: npm audit --audit-level=high
      - run: npm run lint
      # The site's own prebuild runs the generators and the validator chain.
      - run: npm run build
      # A dirty tree here means committed generated content is stale: the
      # build regenerates the corpus, and `verify` cannot check this locally
      # because a working tree is dirty with the change in progress.
      - name: Check generated content is committed
        run: git diff --exit-code
      # Reads the prerendered HTML, so it has to follow the build rather than
      # ride the prebuild validator chain.
      - run: node scripts/validate-rendered-spacing.mjs
      # Same reason: compares the corpus against what the pages actually render.
      - run: node scripts/validate-corpus-coverage.mjs
      # Every internal href in the prerendered HTML must lead to a page,
      # route handler, public file, or redirect that exists.
      - run: node scripts/validate-internal-links.mjs
      # Canonicals, Open Graph, JSON-LD and the sitemap, read from the same
      # built output.
      - run: node scripts/validate-seo.mjs
      # Serves the build and loads it in a real browser: hydration must
      # succeed and the page must be visible with content. HTTP 200 and a
      # green build prove neither — the 2026-09-06 outage served 200 while
      # every JS browser showed a blank page.
      - run: npx playwright install --with-deps chromium
      - run: node scripts/smoke-hydration.mjs
      # axe over the served pages in both themes: page-level composition
      # (landmarks, heading order, the mounted chrome). The rule set and its
      # one settled exclusion are recorded in the script itself.
      - run: node scripts/validate-website-a11y.mjs
