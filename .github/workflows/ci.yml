name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    name: Lint + build library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      # validate-registry (run by prebuild) regenerates README/skills content;
      # a dirty tree here means committed generated content is stale.
      - name: Check generated content is committed
        run: git diff --exit-code

  test:
    name: Story tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test

  storybook:
    name: Build Storybook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build-storybook

  website:
    name: Build website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: website
      - run: npm run lint
        working-directory: website
      - run: npm run build
        working-directory: website
