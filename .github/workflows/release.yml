name: Release

# Publishes @robr0/design-system to npm — manually triggered, dry-run by
# default. The publish happens FROM dist/ (its generated package.json is
# the one that ships; the root manifest stays private and never publishes).
#
# Setup is complete: the @robr0 scope belongs to the robr0 npm account and
# NPM_TOKEN is set as a repo secret. 0.1.0 shipped 2026-07-26.
#
# To cut a release, follow the `release` skill (.claude/skills/release):
# bump PACKAGE_VERSION in scripts/package-manifest.mjs, dry-run, run for
# real, then tag the published commit.
#
# NPM_TOKEN is a granular token WITH AN EXPIRY — when it lapses this
# workflow fails at the publish step with a 401. npm is also deprecating
# 2FA-bypass tokens for direct publishing (Jan 2027), so the durable fix is
# Trusted Publishing (OIDC): `id-token: write` is already set below, so the
# migration is mostly deleting the token and registering this workflow as a
# trusted publisher on npmjs.com.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and smoke-test, skip the actual npm publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm --provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:lib
      # Pack the tarball, scaffold a real Vite consumer, install, tsc, build —
      # fails the release before anything reaches the registry.
      - name: Consumer smoke test
        run: node scripts/smoke-consumer.mjs
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Dry-run publish preview
        if: ${{ inputs.dry_run }}
        working-directory: dist
        run: npm publish --access public --dry-run
