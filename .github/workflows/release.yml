name: Release

# Publishes @robr0/design-system to npm — manually triggered, dry-run by
# default. The publish happens FROM dist/ (its generated package.json is
# the one that ships; the root manifest stays private and never publishes).
#
# AUTH: Trusted Publishing (OIDC). There is no npm token. GitHub mints a
# short-lived OIDC token for this workflow, and npm accepts it because this
# repo + workflow filename are registered as a trusted publisher on the
# package's npmjs.com settings page. Consequences worth knowing:
#   - `permissions: id-token: write` below is load-bearing — without it the
#     publish fails to authenticate, not just to attach provenance.
#   - The trusted-publisher registration is keyed to THIS FILENAME
#     (release.yml). Renaming or moving this file breaks publishing until
#     the registration is updated on npmjs.com.
#   - Provenance is signed automatically under OIDC; --provenance is kept
#     explicit below so the intent is visible in the log.
#   - A dry run never authenticates, so it cannot prove OIDC works. The only
#     proof is a real publish.
#
# To cut a release, follow the `release` skill (.claude/skills/release):
# bump PACKAGE_VERSION in scripts/package-manifest.mjs, dry-run, run for
# real, then tag the published commit.
#
# 0.1.0 shipped 2026-07-26 using a granular NPM_TOKEN; that token is retired.
# 0.2.0 shipped 2026-07-27 — the first release authenticated by OIDC.
# 0.3.0 shipped 2026-07-28.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run — build and smoke-test, skip the actual npm publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # Required for Trusted Publishing (OIDC) AND provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # NOTE: deliberately NO `registry-url:` here. Setting it makes setup-node
      # write an .npmrc containing `_authToken=${NODE_AUTH_TOKEN}` AND export a
      # placeholder NODE_AUTH_TOKEN ("XXXXX-XXXXX-..."). npm then believes it is
      # already authenticated, never attempts the OIDC exchange, and the
      # registry rejects the placeholder with a misleading `E404` on PUT.
      # Without it npm finds no credentials and falls through to Trusted
      # Publishing. npm defaults to registry.npmjs.org anyway, and the package
      # sets no publishConfig, so nothing is lost. (Cost us run 30284784878.)
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # Trusted Publishing needs npm >= 11.5.1. Node 24 does not ship a new
      # enough npm on every patch release, and an older CLI fails to exchange
      # the OIDC token rather than falling back gracefully — so pin it forward
      # explicitly instead of trusting whatever the runner happens to bundle.
      - name: Ensure npm supports Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run build:lib
      # Pack the tarball, scaffold a real Vite consumer, install, tsc, build —
      # fails the release before anything reaches the registry.
      - name: Consumer smoke test
        run: node scripts/smoke-consumer.mjs
      # --loglevel verbose is deliberate: it prints the OIDC token exchange
      # (`POST .../oidc/token/exchange/package/...`), which is the only visible
      # evidence that Trusted Publishing actually authenticated. Without it an
      # auth failure surfaces only as a misleading E404 or ENEEDAUTH.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        working-directory: dist
        run: npm publish --access public --provenance --loglevel verbose
      - name: Dry-run publish preview
        if: ${{ inputs.dry_run }}
        working-directory: dist
        run: npm publish --access public --dry-run
