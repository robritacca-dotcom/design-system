    <style>
        /* Hide page until theme is ready */
        html:not(.theme-ready) { visibility: hidden; }
        html.theme-ready { visibility: visible; }
        /* Hide toggle label until correct text is set */
        html:not(.labels-ready) .theme-toggle-label { visibility: hidden; }
    </style>
    <script>
        // Apply saved theme immediately to prevent flash
        (function() {
            var savedTheme = localStorage.getItem('theme');
            var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            // Use saved preference, or fall back to system preference
            var isLight = savedTheme === 'light' || (savedTheme === null && !systemPrefersDark);
            if (isLight) {
                document.documentElement.setAttribute('data-theme', 'light');
            }
            // Show page now that theme is set
            document.documentElement.classList.add('theme-ready');
            
            // Update toggle labels as soon as DOM is ready
            function updateLabels() {
                var labels = document.querySelectorAll('.theme-toggle-label');
                if (labels.length > 0) {
                    labels.forEach(function(label) {
                        label.textContent = isLight ? 'Light Mode' : 'Dark Mode';
                    });
                    document.documentElement.classList.add('labels-ready');
                } else {
                    requestAnimationFrame(updateLabels);
                }
            }
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', updateLabels);
            } else {
                updateLabels();
            }
            
            // Detect when Material Symbols font is loaded
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(function() {
                    document.documentElement.classList.add('fonts-loaded');
                });
            } else {
                setTimeout(function() {
                    document.documentElement.classList.add('fonts-loaded');
                }, 100);
            }
        })();
    </script>
